name: CogniPath CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-build:
    name: Frontend Vite Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Repository
        # Pinned to full immutable commit SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 20
        # Pinned to full immutable commit SHA
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend Application
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.com

  backend-check:
    name: Backend Lint, Pytest & Import Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Repository
        # Pinned to full immutable commit SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python 3.11
        # Pinned to full immutable commit SHA
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          sed -i 's/>=latest//g' requirements.txt
          pip install -r requirements.txt -r requirements-dev.txt
          git checkout requirements.txt

      - name: Run Ruff Linter
        run: ruff check app/

      - name: Verify Backend Import Integrity
        run: |
          python -c "from app.main import app; print('FastAPI loaded successfully with routes:', len(app.routes))"

      - name: Run Backend Pytest Suite
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          python -m pytest -q
