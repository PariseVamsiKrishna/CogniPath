services:
  # ==========================================================
  # CogniPath FastAPI Backend Service (SmartLearn SIH 2026)
  # Deployed on Render with native Uvicorn & WebSockets support
  # ==========================================================
  - type: web
    name: cognipath-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # Paste your Supabase pooler connection URI here
      - key: SECRET_KEY
        generateValue: true # Render will automatically generate a secure random key
      - key: GEMINI_API_KEY
        sync: false # Set your Google Gemini API key
      - key: OPENAI_API_KEY
        sync: false
